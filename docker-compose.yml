services:
  db:
    image: postgres
    env_file: .env
    ports:
      - "5432:5432"

  orchestrator:
    build: ./backend/mcps/orchestrator_mcp
    container_name: orchestrator
    env_file:
    - .env
    environment:
        - MCP_SERVICE_TOKEN=${MCP_SERVICE_TOKEN}
        - PRODUCT_VECTOR_SEARCH_URL=http://product-vector-search:8001
        - DATABASE_URL=${DATABASE_URL}
        - ANALYTICS_URL=http://analysis:8002
    ports:
      - "8000:8000"
    depends_on:
      - product-vector-search
      - db
  #    - analysis

  product-vector-search:
    build: ./backend/mcps/product_v_search_mcp
    container_name: product-vector-search
    env_file:
    - .env
    environment:
      - MCP_SERVICE_TOKEN=${MCP_SERVICE_TOKEN}
      - HF_SPACE_EMB_URL=${HF_SPACE_EMB_URL}
    ports:
      - "8001:8000"

  #analysis:
  #  build: ./backend/mcps/analysis_mcp
  #  container_name: analysis
  #  environment:
  #    - MCP_SERVICE_TOKEN=supersecret
  #  ports:
  #   - "8002:8000"

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      - orchestrator
