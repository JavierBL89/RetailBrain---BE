version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  orchestrator:
    build: ./backend/mcps/orchestrator_mcp
    container_name: orchestrator
    env_file:
      - .env
    environment:
      - MCP_SERVICE_TOKEN=${MCP_SERVICE_TOKEN}
      - HF_SPACE_EMB_URL=${HF_SPACE_EMB_URL}
      - DATABASE_URL=${DATABASE_URL}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/backend
    command: ["python", "-m", "backend.mcps.orchestrator_mcp.mcp_server"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend  # Mount the backend code for access to all modules
      
  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      - orchestrator

volumes:
  postgres_data:
